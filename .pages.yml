media:
  input: assets
  output: assets

content:
  - name: Tracks
    label: Your Music Library
    type: file
    path: tracks.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
      - name: title
        type: string
        label: Song Title
        required: true
      - name: ep
        type: string
        label: EP / Album Name
        required: false
      - name: releaseDate
        type: string
        label: Release Date (YYYY-MM-DD)
        required: true
      - name: mp3
        type: file
        label: MP3 File (stream + download)
        required: true
      - name: wav
        type: string
        label: WAV Download Link
        description: Upload the WAV to the Cloudflare R2 bucket, then paste its link here
        required: true
      - name: cover
        type: file
        label: Cover Art